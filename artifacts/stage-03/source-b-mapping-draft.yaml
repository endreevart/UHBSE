observation_grouping_hypothesis:
  name: source_b_lab_header_synthesis
  mapping_status: HYPOTHESIS
  clinically_confirmed: false
  rule: >
    When no confirmed Source B observation header table exists, derive an Observation
    header key from source-local subject_id + consultation_id or pool_id + observation date;
    each analyses_constructor row maps to ObservationComponent; grouping is structural
    hypothesis only and not clinical equivalence with Source A document_analysisresult.
  components:
    - subject from user_id via users
    - consultation_id or pool_id
    - date
  data_levels:
    derived_observation_header: OBSERVATION_HEADER
    analyses_constructor_row: OBSERVATION_VALUE
    analyses_pool: WORKFLOW

notes:
  - public.persons is NOT_MAPPED; empty table; NO_SUBJECT_ROOT
  - consultations.patient_id used instead of nonexistent user_id column
  - analyses_constructor.value used instead of nonexistent result column
