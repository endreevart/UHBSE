stage: "03"
phase: design
title: Canonical Record Construction Contract
version: "0.7.5"
contract_kind: design_only_not_implementation
canonical_id_contract_ref: canonical-id-contract.yaml

purpose: >
  Define deterministic rules for constructing complete canonical evidence records
  from source rows. Field mappings alone are insufficient; this contract closes
  the gap between mapping drafts and fully populated canonical entities.

global_rules:
  canonical_record_from_source_row:
    rule: Each construction group specifies how one source row (or filtered subset)
      materializes one or more canonical records of a target entity.
  deterministic_canonical_ids:
    rule: Primary keys use canonical_id_contract HMAC-SHA256 with domain separation
    contract: canonical-id-contract.yaml
    forbidden: random UUIDs, auto-increment assumptions, cross-source shared IDs
  source_local_subject_resolution:
    rule: subject_id always resolves to a source-local Subject; no cross-source merge
  generated_fields:
    rule: Document algorithm for each generated canonical field (IDs, keys)
  constant_fields:
    rule: Document fixed values (data_level, null clinical times, provenance profile)
  field_mappings:
    rule: Link source columns to canonical fields with typed value selection
  parent_child_relationships:
    rule: Child records reference parent IDs produced in the same or parent construction group
  wide_to_long_transformations:
    rule: One source row may fan out to multiple child records (characteristics, components)
  null_emission_policy:
    rule: When source value is null, canonical record or component is not emitted
    forbidden: [empty_string_substitution, zero_substitution, false_substitution, placeholder_values]
  target_field_collision_policy:
    rule: Multiple source columns mapping to one canonical field require explicit
      combination_rule, precedence_rule, grouping_rule, or target_collision_rule
    forbidden: silent_last_write_wins
    record_group_alone_insufficient: true
  timestamp_precedence:
    rule: System timestamps use documented coalesce/precedence; clinical times remain null when absent
  provenance_population:
    rule: SOURCE_BACKED records include algorithms for all required provenance fields
  raw_value_serialization:
    rule: lossless serialization of source value into raw_value parallel to typed fields
  mapping_status_propagation:
    rule: Canonical status mirrors construction group mapping_status unless overridden
  no_cross_source_merge:
    forbidden: [cross_source_consolidation, overwriting values from another source system]
  subject_root_candidate_eligibility:
    rule: public.users is multi-role SUBJECT_ROOT_CANDIDATE; Subject emission requires
      documented patient linkage (e.g. public.consultations.patient_id)
    forbidden: [row_filter_always, is_doctor_false_as_patient_proof, emit_all_users]
  source_record_emission:
    rule: >
      Emit exactly one SourceRecord per source row that participates in a pilot
      construction group. SourceRecord must be created before any dependent canonical
      evidence record from the same source row. Locator uses HMAC per canonical-id-contract;
      raw source primary key must not be stored as an open value.
    locator: hmac_locator_canonical_id_contract
    raw_primary_key_open_storage: forbidden
    load_order: before_dependent_evidence_records

x-source-backed-provenance: &source_backed_provenance
  profile: SOURCE_BACKED
  algorithms:
    record_origin: constant_OBSERVED
    source_system: from_group.source_system
    source_schema: split_source_relation_schema
    source_relation: from_group.source_relation
    source_record_locator: hmac_locator_canonical_id_contract
    transformation_id: stage03_mapping_pipeline
    transformation_version: "0.7.4"
    transformed_at: runtime_iso8601_utc
    input_artifact_sha256: design_content_manifest_sha256
    confidence: mapping_status_to_confidence_band
    mapping_status: from_group.mapping_status

construction_groups:

  - group_id: source_a_source_record_account_patient
    source_system: magerya_api
    source_relation: magerya_api.account_patient
    source_primary_key: id
    target_entity: SourceRecord
    cardinality: one_per_row
    row_filter: always
    identity_rule:
      source_record_id:
        algorithm: HMAC-SHA256
        contract: canonical_id_contract_v0.7.5
        key_reference: canonical_id_key_v1
        inputs: [source_system, source_relation, source_primary_key, source_record]
      source_record_locator:
        algorithm: HMAC-SHA256
        contract: canonical_id_contract_v0.7.5
        key_reference: canonical_id_key_v1
        inputs: [source_system, source_relation, source_primary_key, locator]
    generated_fields:
      source_record_id: identity_rule.source_record_id
      source_record_locator: identity_rule.source_record_locator
    constant_fields:
      source_schema: magerya_api
      source_relation: account_patient
      locator_scheme: deterministic_hmac_locator
      locator_key_version: from_runtime_key_version
    mapped_fields:
      - source_column: created
        canonical_field: source_created_at
        emit_when: source_non_null
      - source_column: modified
        canonical_field: source_updated_at
        emit_when: source_non_null
    subject_resolution: not_applicable
    relationship_fields:
      source_system_id:
        source: SourceSystem.source_system_id
        pilot_value: magerya_api
    null_policy:
      emit_record: true
    collision_policy: none
    provenance_profile: SOURCE_BACKED
    provenance_population: *source_backed_provenance
    mapping_status: CANDIDATE
    implementation_status: not_started

