rules:
- CANDIDATE status is never upgraded to CONFIRMED during crosswalk.
- Curated rules emit HYPOTHESIS only; EVIDENCE_BACKED requires recorded structural
  proofs.
- Mappings require compatible data_level on both sides.
- No cross-source patient identity linkage is attempted.
- Absence of a mapped table does not imply absence of entity data in other storage
  forms.
entity_types:
  patients:
    source_a_candidates:
    - schema: magerya_api
      relation: account_patient
      role: ENTITY
      data_level: ATTRIBUTE_CONTAINER
      status: CANDIDATE
    source_b_candidates:
    - schema: public
      relation: persons
      role: ENTITY
      data_level: ATTRIBUTE_CONTAINER
      status: CANDIDATE
    mappings:
    - source_a: magerya_api.account_patient
      source_b: null
      confidence: UNKNOWN
      candidate_status: CANDIDATE
      source_a_data_level: ATTRIBUTE_CONTAINER
      source_b_data_level: null
      evidence_refs:
      - no_structural_or_name_match
    - source_a: null
      source_b: public.persons
      confidence: UNKNOWN
      candidate_status: CANDIDATE
      source_a_data_level: null
      source_b_data_level: ATTRIBUTE_CONTAINER
      evidence_refs:
      - no_source_a_candidate_match
  visits:
