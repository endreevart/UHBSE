stage: "03"
phase: alignment_candidate
title: Decision — Pilot Secret Provider
document_version: "0.2.1"
decision_id: DECISION_REQUIRED_SECRET_PROVIDER
status: CONFIRMED
blocks_live_load: true
confirmed_at_phase: alignment_v0.2

question: >
  Which secret-store provider supplies the canonical HMAC key reference and the canonical loader
  login credential for the first Source A pilot live load?

decision:
  provider: hashicorp_vault
  deployment_target: self_hosted_docker_or_cloud_vm
  vault_mode: production
  dev_mode_prohibited: true
  persistent_storage: true
  tls_required: true
  network: private_loopback_publish_only
  confirmed_by: operator
  confirmation_text: "confirm provider: HashiCorp Vault"

kv_v2:
  mount: uhbse
  logical_paths:
    - canonical/hmac-subject-key
    - canonical/loader-credential

contract_references:
  hmac_subject_key: "vault://uhbse/canonical/hmac-subject-key?version=1"
  loader_credential: "vault://uhbse/canonical/loader-credential?version=1"

identity_separation:
  vault_auth_identity: uhbse-canonical-loader
  postgres_login_principal: canonical_loader_login
  postgres_nologin_group_role: canonical_loader
  note: >
    AppRole uhbse-canonical-loader authenticates to Vault only. It must not be named or
    treated as a PostgreSQL principal. PostgreSQL LOGIN principal canonical_loader_login
    is planned separately and is not provisioned by Vault bootstrap.

provisioning:
  compose_service: vault
  config: ops/vault/config/vault.hcl
  policy: ops/vault/policies/uhbse-canonical-loader.hcl
  runbooks:
    - ops/vault/runbooks/init-unseal.md
    - ops/vault/runbooks/bootstrap-kv-approle.md
    - ops/vault/runbooks/raft-snapshot-restore.md
    - ops/vault/runbooks/audit-and-log-rotation.md
  preflight_script: ops/vault/scripts/preflight.sh
  preflight_evidence: artifacts/stage-03-alignment-candidate/vault-preflight.json
  vault_stop_review_zip: artifacts/external-review/stage-03-alignment-vault-stop-v0.2.1-review.zip

affected_contracts:
  - contract_key: subject_key_transformation_contract
    authoritative_path: artifacts/stage-03/canonical-id-contract.yaml
    key_reference_target: "vault://uhbse/canonical/hmac-subject-key?version=1"
    blocker_id: source_subject_key_opacity_undefined
    status: PROVIDER_SELECTED_CONTRACT_NOT_YET_CLOSED
  - contract_key: canonical_loader_runtime_contract
    authoritative_path: artifacts/stage-03-implementation/security-runtime-plan.yaml
    credential_source_reference_target: "vault://uhbse/canonical/loader-credential?version=1"
    blocker_id: canonical_loader_runtime_principal_undefined
    status: BLOCKED_UNTIL_POSTGRES_PRINCIPAL_PLAN_CONFIRMED

forbidden:
  - vault_dev_mode
  - literal_secrets_in_git
  - treating_approle_as_postgres_principal
  - completing_loader_runtime_contract_before_postgres_principal_confirmation

next_step: >
  PostgreSQL LOGIN canonical_loader_login is provisioned (DRAFT evidence). Do not close
  canonical_loader_runtime_contract until open operational-security findings are resolved.
  Live load remains blocked.
